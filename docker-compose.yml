name: openwikirag

x-openwikirag-environment: &openwikirag-environment
  OPENWIKIRAG_ENVIRONMENT: ${OPENWIKIRAG_ENVIRONMENT:-development}
  OPENWIKIRAG_LOG_LEVEL: ${OPENWIKIRAG_LOG_LEVEL:-INFO}
  OPENWIKIRAG_API_HOST: 0.0.0.0
  OPENWIKIRAG_API_PORT: "8000"
  OPENWIKIRAG_WORKER_HEALTH_HOST: 0.0.0.0
  OPENWIKIRAG_WORKER_HEALTH_PORT: "8001"
  OPENWIKIRAG_DATABASE_URL: "postgresql+asyncpg://openwikirag_app:${POSTGRES_APP_PASSWORD:-openwikirag-dev-password}@postgres:5432/${POSTGRES_DB:-openwikirag}"
  OPENWIKIRAG_MIGRATION_DATABASE_URL: "postgresql+asyncpg://openwikirag:${POSTGRES_PASSWORD:-openwikirag-dev-password}@postgres:5432/${POSTGRES_DB:-openwikirag}"
  OPENWIKIRAG_JWT_SECRET: ${OPENWIKIRAG_JWT_SECRET:-replace-with-a-long-development-secret-at-least-32-chars}
  OPENWIKIRAG_JWT_ISSUER: ${OPENWIKIRAG_JWT_ISSUER:-openwikirag-compose}
  OPENWIKIRAG_JWT_AUDIENCE: ${OPENWIKIRAG_JWT_AUDIENCE:-openwikirag-api}
  OPENWIKIRAG_AUTH_MODE: ${OPENWIKIRAG_AUTH_MODE:-local}
  OPENWIKIRAG_OIDC_ISSUER: ${OPENWIKIRAG_OIDC_ISSUER:-}
  OPENWIKIRAG_OIDC_AUDIENCE: ${OPENWIKIRAG_OIDC_AUDIENCE:-}
  OPENWIKIRAG_OIDC_JWKS_URL: ${OPENWIKIRAG_OIDC_JWKS_URL:-}
  OPENWIKIRAG_OIDC_ALGORITHMS: ${OPENWIKIRAG_OIDC_ALGORITHMS:-RS256}
  OPENWIKIRAG_OIDC_TENANT_CLAIM: ${OPENWIKIRAG_OIDC_TENANT_CLAIM:-tenant_id}
  OPENWIKIRAG_OIDC_JWKS_CACHE_SECONDS: ${OPENWIKIRAG_OIDC_JWKS_CACHE_SECONDS:-300}
  OPENWIKIRAG_OIDC_JWKS_TIMEOUT_SECONDS: ${OPENWIKIRAG_OIDC_JWKS_TIMEOUT_SECONDS:-5}
  OPENWIKIRAG_AUTH_RATE_LIMIT_ENABLED: ${OPENWIKIRAG_AUTH_RATE_LIMIT_ENABLED:-false}
  OPENWIKIRAG_AUTH_RATE_LIMIT_REQUESTS: ${OPENWIKIRAG_AUTH_RATE_LIMIT_REQUESTS:-10}
  OPENWIKIRAG_AUTH_RATE_LIMIT_WINDOW_SECONDS: ${OPENWIKIRAG_AUTH_RATE_LIMIT_WINDOW_SECONDS:-60}
  OPENWIKIRAG_API_RATE_LIMIT_ENABLED: ${OPENWIKIRAG_API_RATE_LIMIT_ENABLED:-false}
  OPENWIKIRAG_API_RATE_LIMIT_REQUESTS: ${OPENWIKIRAG_API_RATE_LIMIT_REQUESTS:-60}
  OPENWIKIRAG_API_RATE_LIMIT_WINDOW_SECONDS: ${OPENWIKIRAG_API_RATE_LIMIT_WINDOW_SECONDS:-60}
  OPENWIKIRAG_TRUSTED_PROXY_CIDRS: ${OPENWIKIRAG_TRUSTED_PROXY_CIDRS:-}
  OPENWIKIRAG_OBJECT_STORE_ROOT: /data/objects
  OPENWIKIRAG_REDIS_URL: redis://redis:6379/0
  OPENWIKIRAG_QDRANT_URL: http://qdrant:6333
  OPENWIKIRAG_NEO4J_URI: bolt://neo4j:7687
  OPENWIKIRAG_NEO4J_USER: neo4j
  OPENWIKIRAG_NEO4J_PASSWORD: ${NEO4J_PASSWORD:-openwikirag-dev-password}
  OPENWIKIRAG_GRAPH_ENABLED: ${OPENWIKIRAG_GRAPH_ENABLED:-false}
  OPENWIKIRAG_WIKI_GENERATION_MODEL: ${OPENWIKIRAG_WIKI_GENERATION_MODEL:-}
  OPENWIKIRAG_WIKI_GENERATION_MODEL_DIGEST: ${OPENWIKIRAG_WIKI_GENERATION_MODEL_DIGEST:-}
  OPENWIKIRAG_WIKI_GENERATION_BASE_URL: ${OPENWIKIRAG_WIKI_GENERATION_BASE_URL:-http://ollama:11434}
  OPENWIKIRAG_WIKI_GENERATION_TIMEOUT_SECONDS: ${OPENWIKIRAG_WIKI_GENERATION_TIMEOUT_SECONDS:-60}
  OPENWIKIRAG_DENSE_EMBEDDING_MODEL: ${OPENWIKIRAG_DENSE_EMBEDDING_MODEL:-}
  OPENWIKIRAG_DENSE_EMBEDDING_MODEL_DIGEST: ${OPENWIKIRAG_DENSE_EMBEDDING_MODEL_DIGEST:-}
  OPENWIKIRAG_DENSE_EMBEDDING_BASE_URL: ${OPENWIKIRAG_DENSE_EMBEDDING_BASE_URL:-http://ollama:11434}
  OPENWIKIRAG_DENSE_EMBEDDING_DIMENSIONS: ${OPENWIKIRAG_DENSE_EMBEDDING_DIMENSIONS:-128}
  OPENWIKIRAG_DENSE_EMBEDDING_TIMEOUT_SECONDS: ${OPENWIKIRAG_DENSE_EMBEDDING_TIMEOUT_SECONDS:-60}
  OPENWIKIRAG_INGESTION_CONSUMER_NAME: ${OPENWIKIRAG_INGESTION_CONSUMER_NAME:-compose-worker}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-openwikirag}
      POSTGRES_USER: ${POSTGRES_USER:-openwikirag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-openwikirag-dev-password}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:-openwikirag-dev-password}
    ports:
      - "${OPENWIKIRAG_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${OPENWIKIRAG_REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-openwikirag-dev-password}
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
    ports:
      - "${OPENWIKIRAG_NEO4J_HTTP_PORT:-7474}:7474"
      - "${OPENWIKIRAG_NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs

  qdrant:
    image: qdrant/qdrant:v1.14.1
    ports:
      - "${OPENWIKIRAG_QDRANT_HTTP_PORT:-6333}:6333"
      - "${OPENWIKIRAG_QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant-data:/qdrant/storage

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-openwikirag}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-openwikirag-dev-password}
    ports:
      - "${OPENWIKIRAG_MINIO_API_PORT:-9000}:9000"
      - "${OPENWIKIRAG_MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    command: ["server", "/data", "--console-address", ":9001"]

  migrate:
    build:
      context: .
    image: openwikirag:local
    environment: *openwikirag-environment
    command:
      ["sh", "-c", "alembic upgrade head && python -m openwikirag.checkpoint_cli --grant-role openwikirag_app"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    healthcheck:
      disable: true

  api:
    build:
      context: .
    image: openwikirag:local
    environment: *openwikirag-environment
    command: ["uvicorn", "apps.api.app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    ports:
      - "${OPENWIKIRAG_API_PORT:-8000}:8000"
    volumes:
      - app-objects:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  worker:
    build:
      context: .
    image: openwikirag:local
    environment: *openwikirag-environment
    command: ["python", "-m", "apps.worker.app.main"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    volumes:
      - app-objects:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/readyz', timeout=2)"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3

volumes:
  app-objects:
  postgres-data:
  redis-data:
  neo4j-data:
  neo4j-logs:
  qdrant-data:
  minio-data:
