[project]
name = "openwikirag"
version = "0.1.0"
description = "Production-oriented enterprise knowledge platform built with WikiRAG, hybrid retrieval, and knowledge graphs."
requires-python = ">=3.13,<3.14"
readme = "README.md"
dependencies = [
  "alembic>=1.15,<2.0",
  "asyncpg>=0.30,<1.0",
  "fastapi>=0.115,<1.0",
  "PyJWT>=2.10,<3.0",
  "pydantic-settings>=2.7,<3.0",
  "python-multipart>=0.0.20,<1.0",
  "pwdlib[argon2]>=0.2,<1.0",
  "redis>=5.2,<6.0",
  "sqlalchemy[asyncio]>=2.0,<2.1",
  "structlog>=25.1,<26.0",
  "uvicorn[standard]>=0.34,<1.0",
  "pypdf>=6.0,<7.0",
  "qdrant-client==1.14.3",
  "neo4j>=6.0,<7.0",
  "httpx>=0.28,<1.0",
]

[project.optional-dependencies]
models = ["sentence-transformers>=5.1,<6.0"]

[dependency-groups]
dev = [
  "aiosqlite>=0.20,<1.0",
  "mypy>=1.15,<2.0",
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.25,<1.0",
  "ruff>=0.9,<1.0",
]

[build-system]
requires = ["hatchling>=1.27,<2.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openwikirag"]

[tool.pytest.ini_options]
testpaths = ["apps/api/tests", "apps/worker/tests"]
addopts = "-q"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "apps"]
